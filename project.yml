name: MahindraODBCBle
options:
  bundleIdPrefix: com.liaanvdmerwe
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_STRICT_CONCURRENCY: minimal
targets:
  ScorpioCodes:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
      - path: Sources/OBDCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Scorpio Codes
        LSApplicationCategoryType: public.app-category.utilities
        NSBluetoothAlwaysUsageDescription: Scorpio Codes connects to an OBD-II Bluetooth dongle to read fault codes from your Mahindra Scorpio S11.
        NSBluetoothPeripheralUsageDescription: Scorpio Codes connects to an OBD-II Bluetooth dongle to read fault codes from your Mahindra Scorpio S11.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liaanvdmerwe.ScorpioCodes
        PRODUCT_NAME: ScorpioCodes
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_PREVIEWS: YES
